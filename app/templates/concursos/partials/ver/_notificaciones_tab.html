<div class="tab-pane fade" id="notificaciones" role="tabpanel" aria-labelledby="notificaciones-tab">
    <div class="card">
        <div class="card-header header-primary">
            <h4 class="mb-0"><i class="bi bi-bell"></i> Panel de Notificaciones</h4>
        </div>
        <div class="card-body">
            {% include 'notifications/_notification_panel.html' %}
        </div>
    </div>
</div>

<!-- Modal for Notification Preview -->
<div class="modal fade" id="notificationPreviewModal" tabindex="-1" aria-labelledby="notificationPreviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="notificationPreviewModalLabel">Vista Previa de Notificación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="notificationPreviewContent" style="max-height: 70vh; overflow-y: auto;">
                <!-- Preview content will be loaded here -->
                <div class="text-center">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" id="confirmSendNotification">
                    <i class="fas fa-paper-plane"></i> Confirmar Envío
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let currentConcursoId = null;
let currentCampaignId = null;
// Respect application mount point (e.g., /selecciones-docentes in production)
const APP_BASE = (document.querySelector('meta[name="app-base"]')?.getAttribute('content')) || '';

function showNotificationPreview(concursoId, campaignId) {
    currentConcursoId = concursoId;
    currentCampaignId = campaignId;
    
    // Show the modal
    const modal = new bootstrap.Modal(document.getElementById('notificationPreviewModal'));
    modal.show();
    
    // Load preview data with robust error handling (prefix with script_root for subpath deployments)
    fetch(`${APP_BASE}/concursos/${concursoId}/notifications/campaigns/${campaignId}/preview`)
        .then(async (response) => {
            // If server returned a non-success status, surface a readable error
            if (!response.ok) {
                const text = await response.text();
                const message = text && text.length > 0 ? text.substring(0, 200) + (text.length > 200 ? '…' : '') : response.statusText;
                throw new Error(`HTTP ${response.status} - ${message}`);
            }
            // Ensure we received JSON; if not, treat as error (e.g., login page HTML)
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.toLowerCase().includes('application/json')) {
                const text = await response.text();
                throw new Error('Respuesta no válida (se esperaba JSON).');
            }
            return response.json();
        })
        .then((data) => {
            if (data && data.error) {
                document.getElementById('notificationPreviewContent').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i> Error al cargar la vista previa: ${data.error}
                    </div>
                `;
                return;
            }
            renderPreviewContent(data);
        })
        .catch((error) => {
            console.error('Error loading preview:', error);
            document.getElementById('notificationPreviewContent').innerHTML = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle"></i> Error al cargar la vista previa.<br/>
                    <small class="text-muted">${(error && error.message) ? error.message : 'Error desconocido'}</small>
                </div>
            `;
        });
}

function renderPreviewContent(data) {
    // Recipients list
    let recipientsHtml = '';
    if (data.recipients && data.recipients.length > 0) {
        recipientsHtml = `
            <div class="mb-3">
                <h6 class="border-bottom pb-1"><i class="fas fa-users"></i> Destinatarios (${data.recipient_count}):</h6>
                <div class="border rounded p-2" style="max-height: 150px; overflow-y: auto; background-color: #f8f9fa;">
        `;
        data.recipients.forEach(recipient => {
            recipientsHtml += `
                <div class="mb-1">
                    <strong>${recipient.name}</strong> <small class="text-muted">(${recipient.email})</small>
                </div>
            `;
        });
        recipientsHtml += '</div></div>';
    }
    
    // Document attachments
    let attachmentsHtml = '';
    if (data.document_attachments && data.document_attachments.length > 0) {
        attachmentsHtml += `
            <div class="mb-2">
                <strong>Documentos del Concurso:</strong>
                <ul class="list-unstyled ms-3 mb-0">
        `;
        data.document_attachments.forEach(doc => {
            const statusClass = doc.exists ? 'text-success' : 'text-danger';
            const statusIcon = doc.exists ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';
            attachmentsHtml += `
                <li><i class="${statusIcon} ${statusClass}"></i> ${doc.template_name} (${doc.version})</li>
            `;
        });
        attachmentsHtml += '</ul></div>';
    }
    
    // Custom attachments
    if (data.custom_attachments && data.custom_attachments.length > 0) {
        attachmentsHtml += `
            <div class="mb-2">
                <strong>Adjuntos Personalizados:</strong>
                <ul class="list-unstyled ms-3 mb-0">
        `;
        data.custom_attachments.forEach(attachment => {
            const statusClass = attachment.exists ? 'text-success' : 'text-danger';
            const statusIcon = attachment.exists ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';
            attachmentsHtml += `
                <li><i class="${statusIcon} ${statusClass}"></i> ${attachment.name}</li>
            `;
        });
        attachmentsHtml += '</ul></div>';
    }
    
    // Estado change info
    let estadoChangeHtml = '';
    if (data.estado_change) {
        estadoChangeHtml = `
            <div class="alert alert-info mb-3">
                <h6 class="mb-2"><i class="fas fa-exchange-alt"></i> Cambio de Estado</h6>
                <div class="row">
                    <div class="col-6">
                        <strong>Estado:</strong><br>
                        <span class="text-muted">${data.estado_change.estado_actual || 'Sin estado'}</span> → 
                        <span class="text-primary">${data.estado_change.nuevo_estado}</span>
                    </div>
                    <div class="col-6">
                        <strong>Subestado:</strong><br>
                        <span class="text-muted">${data.estado_change.subestado_actual || 'Sin subestado'}</span> → 
                        <span class="text-primary">${data.estado_change.nuevo_subestado || 'Sin subestado'}</span>
                    </div>
                </div>
            </div>
        `;
    }

    const content = `
        <div class="container-fluid">
            <!-- Email Preview Section -->
            <div class="row mb-3">
                <div class="col-12">
                    <h6 class="border-bottom pb-2">Vista Previa del Email</h6>
                    <div class="card">
                        <div class="card-header bg-light">
                            <strong>Asunto:</strong> ${data.subject}
                        </div>
                        <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                            ${data.body_html}
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Recipients and Attachments Row -->
            <div class="row">
                <div class="col-md-6">
                    <h6 class="border-bottom pb-1"><i class="fas fa-users"></i> Destinatarios</h6>
                    ${recipientsHtml}
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <h6 class="border-bottom pb-1"><i class="fas fa-paperclip"></i> Adjuntos</h6>
                        <div class="border rounded p-2" style="background-color: #f8f9fa; min-height: 100px;">
                            ${attachmentsHtml || '<p class="text-muted mb-0">No hay adjuntos configurados.</p>'}
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Estado Change Section -->
            ${estadoChangeHtml}
        </div>
    `;
    
    document.getElementById('notificationPreviewContent').innerHTML = content;
}

// Handle confirmation
document.getElementById('confirmSendNotification').addEventListener('click', function() {
    if (currentConcursoId && currentCampaignId) {
        // Create and submit a form to trigger the notification
        const form = document.createElement('form');
        form.method = 'POST';
        // Prefix with script_root so it works under subpaths like /selecciones-docentes
        form.action = `${APP_BASE}/concursos/${currentConcursoId}/notifications/campaigns/${currentCampaignId}/trigger`;
        document.body.appendChild(form);
        form.submit();
    }
});
</script>
